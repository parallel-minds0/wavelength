name: Validate source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: wavelength-addon
          path: dist/wavelength-addon-*.zip
# Native patch releases are assembled only after the real Linux install/repair/
# uninstall and viewport checks. tools/build_installer.py creates the payload;
# no CI job publishes an unvalidated Blender runtime or Python-only installer.
