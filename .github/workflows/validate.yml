name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/release.py
      - name: Bundle installer runtime for tags
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: wavelength-addon
          path: |
            dist/wavelength-addon-*.zip
            dist/wavelength-installer-*.tar.gz
            dist/wavelength-installer-*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wavelength-addon
          path: dist
      - name: Publish prerelease artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
