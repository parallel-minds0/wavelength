name: Build Windows native patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-patch.yml'
      - 'tools/prepare_windows_delta.py'
permissions:
  contents: read
jobs:
  patch:
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch pinned sources and Windows dependencies (internal build only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_LFS_SKIP_SMUDGE = '1'
          git clone --depth 1 --branch v5.2.2 https://github.com/blender/blender.git C:/wl-source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $expected = (Get-Content native/blender/source.json | ConvertFrom-Json).commit
          if ((git -C C:/wl-source rev-parse HEAD).Trim() -ne $expected) { throw 'Source revision mismatch' }
          Remove-Item Env:GIT_LFS_SKIP_SMUDGE
          git -C C:/wl-source config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git -C C:/wl-source lfs pull
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C C:/wl-source -c submodule.lib/windows_x64.update=checkout submodule update --init --depth 1 lib/windows_x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C C:/wl-source apply "$env:GITHUB_WORKSPACE/native/blender/grid-5.2.2.patch"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compile internal patched executable
        shell: pwsh
        run: |
          cmake -S C:/wl-source -B C:/wl-build -G Ninja -C C:/wl-source/build_files/cmake/config/blender_release.cmake -DCMAKE_BUILD_TYPE=Release -DWITH_GTESTS=OFF -DWITH_CYCLES_CUDA_BINARIES=OFF -DWITH_CYCLES_HIP_BINARIES=OFF -DWITH_CYCLES_ONEAPI_BINARIES=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build C:/wl-build --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Produce binary difference (no Windows injection or Blender execution)
        shell: pwsh
        run: |
          python -m pip install bsdiff4==1.2.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/prepare_windows_delta.py --build C:/wl-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-patch-untested
          path: build/windows-patch/*
          if-no-files-found: error
          retention-days: 30
